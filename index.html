<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA Portfolio</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<!-- AOS Animation -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="bg"></div>

<!-- NAV -->
<header>
  <div class="logo">NOVA</div>
  <button onclick="toggleTheme()">🌙</button>
</header>

<!-- HERO -->
<section class="hero">
  <h1 data-aos="fade-up">NOVA</h1>

  <div class="type" id="type" data-aos="fade-up"></div>

  <p data-aos="fade-up">
    I build modern websites, bold designs, and content that helps businesses grow online.
  </p>

  <a href="https://wa.me/2349135196246" class="btn" data-aos="zoom-in">
    Hire Me
  </a>
</section>

<!-- SERVICES -->
<section class="section">
  <h2 data-aos="fade-right">Services</h2>

  <div class="cards">
    <div class="card" data-aos="fade-up">🎨 Graphic Design</div>
    <div class="card" data-aos="fade-up">💻 Web Development</div>
    <div class="card" data-aos="fade-up">✍️ Content Writing</div>
  </div>
</section>

<!-- PORTFOLIO -->
<section class="section">
  <h2 data-aos="fade-right">Projects</h2>

  <div class="gallery">
    <img src="assets/project1.jpg" onclick="openModal(this.src)" data-aos="zoom-in">
    <img src="assets/project2.jpg" onclick="openModal(this.src)" data-aos="zoom-in">
    <img src="assets/project3.jpg" onclick="openModal(this.src)" data-aos="zoom-in">
  </div>
</section>

<!-- WHY ME -->
<section class="section">
  <h2 data-aos="fade-right">Why Choose Me</h2>

  <div class="cards">
    <div class="card" data-aos="flip-left">⚡ Fast Delivery</div>
    <div class="card" data-aos="flip-left">💡 Clean Design</div>
    <div class="card" data-aos="flip-left">📱 Easy Communication</div>
  </div>
</section>

<!-- CONTACT -->
<section class="section">
  <h2 data-aos="fade-up">Let’s Work Together</h2>

  <a href="https://wa.me/2349135196246" class="btn contact">
    Chat on WhatsApp
  </a>
</section>

<!-- MODAL -->
<div id="modal" class="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<!-- SCRIPTS -->
<script src="script.js"></script>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({ duration: 800, once: true });
</script>

</body>
</html>
